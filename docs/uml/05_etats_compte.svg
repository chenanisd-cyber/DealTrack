</style><rect width="1240" height="560" fill="#ffffff"/><text x="20.0" y="30.0" class="t13 b" text-anchor="start">Diagramme d&#x27;états-transitions : compte membre et désinscription (User.deleted_at, User.anonymised_at)</text><circle cx="50" cy="190" r="9" fill="#1d2433"/><rect x="130" y="70" width="540" height="290" rx="18" fill="#f7f8fa" stroke="#1d2433" stroke-width="1.4"/><text x="146.0" y="92.0" class="t13 b" text-anchor="start">Actif  [is_active, deleted_at vide]</text><circle cx="175" cy="165" r="9" fill="#1d2433"/><rect x="220" y="135" width="160" height="60" rx="14" fill="#ffffff" stroke="#1d2433" stroke-width="1.4"/><text x="300.0" y="170.0" class="t13 b" text-anchor="middle">Gratuit</text><rect x="470" y="135" width="160" height="60" rx="14" fill="#ffffff" stroke="#1d2433" stroke-width="1.4"/><text x="550.0" y="170.0" class="t13 b" text-anchor="middle">VIP</text><path d="M184.0,165.0 L220.0,165.0" class="ln" marker-end="url(#filled)"/><path d="M380.0,152.0 L470.0,152.0" class="ln" marker-end="url(#filled)"/><rect x="376.3" y="118.0" width="97.5" height="20" fill="#ffffff" opacity="0.92"/><text x="425.0" y="132.0" class="t11" text-anchor="middle">paiement réussi</text><path d="M470.0,180.0 L380.0,180.0" class="ln" marker-end="url(#filled)"/><rect x="370.4" y="198.0" width="109.1" height="20" fill="#ffffff" opacity="0.92"/><text x="425.0" y="212.0" class="t11" text-anchor="middle">[ends_at dépassé]</text><text x="150.0" y="262.0" class="t11 muted" text-anchor="start">Connexion : 5 mots de passe erronés → blocage 15 minutes (django-axes)</text><text x="150.0" y="280.0" class="t11 muted" text-anchor="start">Mot de passe : Argon2, 12 caractères, trois classes, pas de mot courant</text><text x="150.0" y="298.0" class="t11 muted" text-anchor="start">Export de mes données (JSON) possible à tout moment (portabilité RGPD)</text><rect x="870" y="90" width="300" height="100" rx="14" fill="#ffffff" stroke="#1d2433" stroke-width="1.4"/><text x="1020.0" y="111.0" class="t13 b" text-anchor="middle">Désinscrit (soft delete)</text><line x1="870" y1="120" x2="1170" y2="120" stroke="#1d2433" stroke-width="1"/><text x="880.0" y="138.0" class="t11" text-anchor="start">entry / deleted_at, is_active = faux, AuditLog</text><text x="880.0" y="154.0" class="t11" text-anchor="start">factures et abonnements conservés</text><text x="880.0" y="170.0" class="t11" text-anchor="start">(obligation comptable : 7 ans)</text><rect x="870" y="330" width="300" height="100" rx="14" fill="#ffffff" stroke="#1d2433" stroke-width="1.4"/><text x="1020.0" y="351.0" class="t13 b" text-anchor="middle">Anonymisé (droit à l&#x27;oubli)</text><line x1="870" y1="360" x2="1170" y2="360" stroke="#1d2433" stroke-width="1"/><text x="880.0" y="378.0" class="t11" text-anchor="start">entry / e-mail et pseudo écrasés,</text><text x="880.0" y="394.0" class="t11" text-anchor="start">          mot de passe inutilisable, AuditLog</text><text x="880.0" y="410.0" class="t11" text-anchor="start">la clé primaire subsiste (factures)</text><path d="M59.0,190.0 L130.0,190.0" class="ln" marker-end="url(#filled)"/><rect x="17.3" y="231.0" width="97.5" height="62" fill="#ffffff" opacity="0.92"/><text x="66.0" y="245.0" class="t11" text-anchor="middle">s&#x27;inscrire</text><text x="66.0" y="259.0" class="t11" text-anchor="middle">[CGU acceptées,</text><text x="66.0" y="273.0" class="t11" text-anchor="middle">mot de passe</text><text x="66.0" y="287.0" class="t11" text-anchor="middle">robuste]</text><path d="M670.0,140.0 L870.0,140.0" class="ln" marker-end="url(#filled)"/><rect x="671.7" y="95.0" width="196.6" height="34" fill="#ffffff" opacity="0.92"/><text x="770.0" y="109.0" class="t11" text-anchor="middle">fermer son compte [confirmation]</text><text x="770.0" y="123.0" class="t11" text-anchor="middle">ou désactiver (administrateur)</text><path d="M1020.0,190.0 L1020.0,330.0" class="ln" marker-end="url(#filled)"/><rect x="1028.4" y="243.0" width="103.3" height="34" fill="#ffffff" opacity="0.92"/><text x="1080.0" y="257.0" class="t11" text-anchor="middle">anonymiser</text><text x="1080.0" y="271.0" class="t11" text-anchor="middle">(administrateur)</text><path d="M560.0,360.0 L560.0,400.0 L870.0,400.0" class="ln" marker-end="url(#filled)"/><rect x="654.6" y="411.0" width="120.8" height="34" fill="#ffffff" opacity="0.92"/><text x="715.0" y="425.0" class="t11" text-anchor="middle">supprimer via l&#x27;API</text><text x="715.0" y="439.0" class="t11" text-anchor="middle">[aucun paiement]</text><path d="M130,470 L1156,470 L1170,484 L1170,514 L130,514 Z" fill="#fffbe6" stroke="#8a7a3a" stroke-width="1"/><path d="M1156,470 L1156,484 L1170,484" fill="none" stroke="#8a7a3a" stroke-width="1"/><text x="140.0" y="489.0" class="t11" text-anchor="start">Une suppression physique est impossible pour un membre qui a payé : Payment.user est protégé (on_delete=PROTECT).</text><text x="140.0" y="504.0" class="t11" text-anchor="start">La désinscription coupe donc l&#x27;accès sans détruire la ligne : c&#x27;est le principe du « soft delete ».</text></svg>