<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" width="1320" height="720" role="img" aria-label="DealTrack.be — états d&#x27;un deal"><title>DealTrack.be — états d&#x27;un deal</title>
<defs>
  <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1d2433" stroke-width="1.4"/>
  </marker>
  <marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 Z" fill="#1d2433"/>
  </marker>
  <marker id="hollow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
    <path d="M1,1 L15,8 L1,15 Z" fill="#fff" stroke="#1d2433" stroke-width="1.3"/>
  </marker>
  <marker id="diamond" viewBox="0 0 18 12" refX="17" refY="6" markerWidth="18" markerHeight="12" orient="auto-start-reverse">
    <path d="M1,6 L9,1 L17,6 L9,11 Z" fill="#1d2433"/>
  </marker>
</defs>
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #1d2433; }
  .t13 { font-size: 13px; }
  .t12 { font-size: 12px; }
  .t11 { font-size: 11px; }
  .b { font-weight: bold; }
  .i { font-style: italic; }
  .muted { fill: #5b6475; }
  .ln { stroke: #1d2433; stroke-width: 1.3; fill: none; }
  .dash { stroke-dasharray: 6 4; }
</style><rect width="1320" height="720" fill="#ffffff"/><text x="20.0" y="30.0" class="t13 b" text-anchor="start">Diagramme d&#x27;états-transitions : cycle de vie d&#x27;un deal (Deal.status et Deal.deleted_at)</text><rect x="140" y="60" width="880" height="540" rx="18" fill="#f7f8fa" stroke="#1d2433" stroke-width="1.4"/><text x="156.0" y="82.0" class="t13 b" text-anchor="start">Présent dans le flux ou l&#x27;historique  [deleted_at vide]</text><circle cx="70" cy="205" r="9" fill="#1d2433"/><rect x="190" y="160" width="250" height="90" rx="14" fill="#ffffff" stroke="#1d2433" stroke-width="1.4"/><text x="315.0" y="181.0" class="t13 b" text-anchor="middle">En attente de modération</text><line x1="190" y1="190" x2="440" y2="190" stroke="#1d2433" stroke-width="1"/><text x="200.0" y="208.0" class="t11" text-anchor="start">entry / premier relevé de prix (PricePoint)</text><text x="200.0" y="224.0" class="t11" text-anchor="start">statut imposé par le serveur</text><rect x="620" y="120" width="340" height="130" rx="14" fill="#ffffff" stroke="#1d2433" stroke-width="1.4"/><text x="790.0" y="141.0" class="t13 b" text-anchor="middle">Publié</text><line x1="620" y1="150" x2="960" y2="150" stroke="#1d2433" stroke-width="1"/><text x="630.0" y="168.0" class="t11" text-anchor="start">entry / published_at, alertes déclenchées</text><text x="630.0" y="184.0" class="t11" text-anchor="start">          (VIP tout de suite, autres après 2 h)</text><text x="630.0" y="200.0" class="t11" text-anchor="start">voter / recalcul de la température</text><text x="630.0" y="216.0" class="t11" text-anchor="start">prix modifié / nouveau PricePoint</text><rect x="190" y="430" width="250" height="60" rx="14" fill="#ffffff" stroke="#1d2433" stroke-width="1.4"/><text x="315.0" y="465.0" class="t13 b" text-anchor="middle">Refusé</text><rect x="620" y="430" width="340" height="60" rx="14" fill="#ffffff" stroke="#1d2433" stroke-width="1.4"/><text x="790.0" y="465.0" class="t13 b" text-anchor="middle">Expiré</text><rect x="1090" y="290" width="200" height="100" rx="14" fill="#ffffff" stroke="#1d2433" stroke-width="1.4"/><text x="1190.0" y="311.0" class="t13 b" text-anchor="middle">Supprimé (logique)</text><line x1="1090" y1="320" x2="1290" y2="320" stroke="#1d2433" stroke-width="1"/><text x="1100.0" y="338.0" class="t11" text-anchor="start">entry / deleted_at = maintenant</text><text x="1100.0" y="354.0" class="t11" text-anchor="start">invisible, ligne conservée</text><path d="M79.0,205.0 L190.0,205.0" class="ln" marker-end="url(#filled)"/><rect x="62.5" y="253.0" width="114.9" height="34" fill="#ffffff" opacity="0.92"/><text x="120.0" y="267.0" class="t11" text-anchor="middle">soumettre (membre,</text><text x="120.0" y="281.0" class="t11" text-anchor="middle">formulaire ou API)</text><path d="M440.0,195.0 L620.0,195.0" class="ln" marker-end="url(#filled)"/><rect x="434.6" y="153.0" width="190.7" height="34" fill="#ffffff" opacity="0.92"/><text x="530.0" y="167.0" class="t11" text-anchor="middle">publier [modérateur]</text><text x="530.0" y="181.0" class="t11" text-anchor="middle">/ ModerationDecision + AuditLog</text><path d="M315.0,250.0 L315.0,430.0" class="ln" marker-end="url(#filled)"/><rect x="196.3" y="328.0" width="237.4" height="34" fill="#ffffff" opacity="0.92"/><text x="315.0" y="342.0" class="t11" text-anchor="middle">refuser [modérateur, motif obligatoire]</text><text x="315.0" y="356.0" class="t11" text-anchor="middle">/ ModerationDecision + AuditLog</text><path d="M790.0,250.0 L790.0,430.0" class="ln" marker-end="url(#filled)"/><rect x="697.5" y="328.0" width="184.9" height="34" fill="#ffffff" opacity="0.92"/><text x="790.0" y="342.0" class="t11" text-anchor="middle">[ends_at dépassé]</text><text x="790.0" y="356.0" class="t11" text-anchor="middle">ou marquer expiré (modérateur)</text><path d="M1020.0,540.0 L1190.0,540.0 L1190.0,390.0" class="ln" marker-end="url(#filled)"/><rect x="1006.7" y="498.0" width="196.6" height="34" fill="#ffffff" opacity="0.92"/><text x="1105.0" y="512.0" class="t11" text-anchor="middle">supprimer (auteur ou modérateur)</text><text x="1105.0" y="526.0" class="t11" text-anchor="middle">/ AuditLog</text><path d="M140,625 L1006,625 L1020,639 L1020,669 L140,669 Z" fill="#fffbe6" stroke="#8a7a3a" stroke-width="1"/><path d="M1006,625 L1006,639 L1020,639" fill="none" stroke="#8a7a3a" stroke-width="1"/><text x="150.0" y="644.0" class="t11" text-anchor="start">La valeur « draft » (brouillon) existe dans l&#x27;énumération DealStatus mais n&#x27;est utilisée par aucun écran : un deal soumis passe directement en attente.</text><text x="150.0" y="659.0" class="t11" text-anchor="start">La suppression est logique : votes, commentaires, signalements et décisions de modération restent rattachés au deal.</text></svg>