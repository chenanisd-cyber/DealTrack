<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" width="1240" height="500" role="img" aria-label="DealTrack.be — états d&#x27;un paiement"><title>DealTrack.be — états d&#x27;un paiement</title>
<defs>
