name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualite:
    name: Qualité et tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Analyse statique
        run: ruff check .

      - name: Vérifier le format
        run: ruff format --check .

      - name: Aucune migration manquante
        # Un modèle modifié sans migration correspondante casse le déploiement.
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Suite de tests
        run: python manage.py test tests --settings=config.settings.test

      - name: Contrôles de déploiement
        # Vérifie HSTS, cookies sécurisés, absence de secret en dur.
        # La clé est générée ici, pas écrite dans le dépôt : rien qui
        # ressemble à un secret ne doit y figurer, même factice.
        run: |
          export DJANGO_SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(64))")
          python manage.py check --deploy --settings=config.settings.prod
        env:
          DJANGO_ALLOWED_HOSTS: dealtrack.be
          POSTGRES_DB: dealtrack
          POSTGRES_USER: dealtrack
          POSTGRES_PASSWORD: factice
          EMAIL_HOST: smtp.example.be

  demonstration:
    name: Démonstration de bout en bout
    runs-on: ubuntu-latest
    needs: qualite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Base et données de démonstration
        run: |
          python manage.py migrate
          python manage.py seed_demo
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Suppression logique — impact base
        run: python manage.py demo_soft_delete --anonymise
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: API en direct
        run: |
          python manage.py runserver 8000 --noreload &
          sleep 6
          python scripts/api_demo.py http://127.0.0.1:8000
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
